[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "f1model"
version = "1.0.0"
description = "Formula 1 race outcome prediction: pace model + retirement risk + Monte Carlo race simulation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "lightgbm>=4.0",
                "xgboost>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
